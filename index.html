 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض المنتجات</title>
    <!-- استدعاء خط تجوال للأناقة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* شبكة المنتجات */
        .products-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* بطاقة المنتج */
        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* حاوية الفيديو */
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* تفاصيل المنتج والحقول */
        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .form-control[readonly] {
            font-weight: bold;
            color: var(--primary-color);
            background-color: #eff6ff;
            border-color: #bfdbfe;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* زر الإضافة / الطلب */
        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: auto;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>معرض المنتجات المميزة</h1>
        <p>استعرض المنتجات عبر الفيديو واختر ما يناسبك</p>
    </header>

    <main class="products-grid">

        <!-- المنتج الأول -->
        <div class="product-card">
            <div class="video-container">
                <!-- يمكنك استبدال الرابط برابط الفيديو الخاص بك -->
                <video controls poster="https://via.placeholder.com/600x350">
                    <source src="video1.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>
            <div class="product-info">
                <h2 class="product-title">اسم المنتج الأول</h2>

                <!-- حقل السعر -->
                <div class="form-group">
                    <label>السعر:</label>
                    <input type="text" class="form-control" value="150 دولار" readonly>
                </div>

                <!-- حقل العدد -->
                <div class="form-group">
                    <label>الكمية المطلوب شراءها:</label>
                    <input type="number" class="form-control" min="1" value="1">
                </div>

                <!-- حقل إضافي مخصص -->
                <div class="form-group">
                    <label>تفاصيل إضافية / ملاحظات الخاصة بك:</label>
                    <textarea class="form-control" placeholder="اكتب المقاس، اللون، أو أي ملاحظات أخرى هنا..."></textarea>
                </div>

                <button class="btn-submit" onclick="alert('تمت إضافة المنتج إلى السلة!')">إضافة إلى السلة</button>
            </div>
        </div>

        <!-- المنتج الثاني -->
        <div class="product-card">
            <div class="video-container">
                <video controls poster="https://via.placeholder.com/600x350">
                    <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>
            <div class="product-info">
                <h2 class="product-title">اسم المنتج الثاني</h2>

                <!-- حقل السعر -->
                <div class="form-group">
                    <label>السعر:</label>
                    <input type="text" class="form-control" value="280 دولار" readonly>
                </div>

                <!-- حقل العدد -->
                <div class="form-group">
                    <label>الكمية المطلوب شراءها:</label>
                    <input type="number" class="form-control" min="1" value="1">
                </div>

                <!-- حقل إضافي مخصص -->
                <div class="form-group">
                    <label>تفاصيل إضافية / ملاحظات الخاصة بك:</label>
                    <textarea class="form-control" placeholder="اكتب المقاس، اللون، أو أي ملاحظات أخرى هنا..."></textarea>
                </div>

                <button class="btn-submit" onclick="alert('تمت إضافة المنتج إلى السلة!')">إضافة إلى السلة</button>
            </div>
        </div>

    </main>

</body>
</html>
